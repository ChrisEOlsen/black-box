name: ${APP_NAME:-my-black-box-app}

services:
  app:
    build:
      context: .
      target: app
    # The host user's ids. Both containers write into bind mounts — the app
    # compiles CSS into ./src and owns ./data and ./logs; the builder writes
    # generated files into ./src. Running as a mismatched uid makes every one
    # of those a permission error, so install-common.sh records the real values
    # in .env. The 1000 fallback matches the image default.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      # Bound to loopback: a development instance is reachable only from this
      # machine. /launch publishes it through the Cloudflare tunnel, which
      # connects outbound and needs no published port at all. Change this only
      # if you deliberately want the LAN to reach an app whose secrets and
      # data are still local.
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - ./src:/src
      - ./data:/data
      - ./logs:/logs
    env_file: .env

  builder:
    build:
      context: .
      target: builder-cli
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./src:/src
      - ./data:/data
    restart: unless-stopped
